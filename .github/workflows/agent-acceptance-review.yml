# Edict-style validation pipeline for a PR, with fork-safe auto-merge.
#
# Replaces the single acceptance-test review with five validation stages run in
# sequence, modelled on https://github.com/Sowiedu/Edict:
#
#   Schema Validator ─── invalid?   → StructuredError → request changes
#     ↓
#   Name Resolver ────── undefined? → StructuredError (+ candidates)
#     ↓
#   Type Checker ─────── mismatch?  → StructuredError (+ expected type)
#     ↓
#   Effect Checker ───── violation? → StructuredError (+ propagation chain)
#     ↓
#   Contract Verifier ── unproven?  → StructuredError (+ counterexample)
#
# Each stage is a DIFFERENT LLM validation: a dedicated validator service that
# runs inside a NetBird agent network and is reached over that network at
# <stage>.${AGENT_NETWORK_DOMAIN}. The runner joins the network with a setup key
# (the "use netbird + agent network" part), so these validators never need a
# public endpoint. The pipeline is the client: it sends the PR as data, reads
# back a typed StructuredError, and halts on the first failing stage — the same
# compile-and-stop shape Edict uses. On a failure it posts the StructuredError
# as a request-changes review; the PR author fixes and re-pushes (no self-repair
# loop). When all five stages pass it approves and enables auto-merge.
#
# Why workflow_run: posting a review, writing commit statuses, joining the agent
# network (a secret), and enabling auto-merge all need secrets and a write
# token. A `pull_request` workflow triggered by a FORK PR has neither. A
# `workflow_run` workflow always runs from the default branch in the base-repo
# context, so it has both even when the triggering PR came from a fork.
#
# Safety: this workflow never checks out or executes the PR's code. It reads the
# PR's diff, file list, title and body through `gh` as data and forwards them to
# the validators. The PR number and tested SHA arrive as plain text from the "PR
# Metadata" artifact and are validated before use. The validators must likewise
# treat the forwarded diff as untrusted input.
#
# Required secrets (placeholders — fill these in for your org):
#   NB_SETUP_KEY          NetBird setup key the runner uses to join the network.
#   AGENT_NETWORK_DOMAIN  Base domain of the agent network; validators live at
#                         schema.<domain>, names.<domain>, types.<domain>,
#                         effects.<domain>, contract.<domain>.
#   AGENT_NETWORK_TOKEN   (optional) Bearer token sent to the validators.
# Optional:
#   NB_MANAGEMENT_URL     NetBird management URL (defaults to https://api.netbird.io).
#
# Validator contract (each stage):
#   POST https://<stage>.${AGENT_NETWORK_DOMAIN}/v1/validate
#   body: {repo, pr_number, head_sha, stage, title, body, changed_files[], diff}
#   200 response: {"stage","ok":true|false,"errors":[{
#     "kind","message","location"?,          # all stages
#     "candidates"?,                          # Name Resolver
#     "expected_type"?,"actual_type"?,        # Type Checker
#     "propagation_chain"?,                   # Effect Checker
#     "counterexample"?                       # Contract Verifier
#   }]}
name: Agent Edict Validation

on:
  workflow_run:
    workflows:
      - PR Metadata          # must match the `name:` of pr-metadata.yml
    types:
      - completed

# Least privilege for what this workflow actually does:
#   contents: write        enable auto-merge
#   pull-requests: write    submit the review and enable auto-merge
#   statuses: write         publish each stage as a commit status on the PR head
#   actions: read           download the PR Metadata artifact
permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: read

concurrency:
  group: agent-edict-validation-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Edict validation pipeline and auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only act on runs that came from a pull request. Covers both fork and
    # same-repo PRs; ignores pushes to main and other events.
    if: github.event.workflow_run.event == 'pull_request'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # The agent network the validators live in, and the key the runner joins
      # with. Left as secrets so the network is private to the org.
      AGENT_NETWORK_DOMAIN: ${{ secrets.AGENT_NETWORK_DOMAIN }}
      AGENT_NETWORK_TOKEN: ${{ secrets.AGENT_NETWORK_TOKEN }}
      NB_SETUP_KEY: ${{ secrets.NB_SETUP_KEY }}
      NB_MANAGEMENT_URL: ${{ secrets.NB_MANAGEMENT_URL }}
    steps:
      - name: Download PR metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read and validate PR metadata
        id: meta
        run: |
          num="$(cat pr_number.txt)"
          sha="$(cat pr_head_sha.txt)"
          [[ "$num" =~ ^[0-9]+$ ]]       || { echo "bad PR number: $num"; exit 1; }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "bad head sha: $sha"; exit 1; }
          echo "number=$num" >> "$GITHUB_OUTPUT"
          echo "sha=$sha"    >> "$GITHUB_OUTPUT"

      # Skip everything below if the PR is already closed/merged, or its head has
      # moved on since the metadata was recorded (a newer push started its own run).
      - name: Check the PR is still open at this SHA
        id: open
        run: |
          state="$(gh pr view "${{ steps.meta.outputs.number }}" --repo "$REPO" --json state,headRefOid \
            --jq '.state + " " + .headRefOid')"
          echo "state: $state"
          set -- $state
          if [ "$1" != "OPEN" ] || [ "$2" != "${{ steps.meta.outputs.sha }}" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # Refuse to run — rather than silently skip — if the network is not wired
      # up, so a missing secret is visible instead of looking like a pass.
      - name: Require agent-network configuration
        if: steps.open.outputs.proceed == 'true'
        run: |
          missing=""
          [ -n "$NB_SETUP_KEY" ]         || missing="$missing NB_SETUP_KEY"
          [ -n "$AGENT_NETWORK_DOMAIN" ] || missing="$missing AGENT_NETWORK_DOMAIN"
          if [ -n "$missing" ]; then
            echo "::error::missing required secret(s):$missing"
            exit 1
          fi

      # Join the NetBird agent network so the validator services at
      # <stage>.${AGENT_NETWORK_DOMAIN} resolve and are reachable over the tunnel.
      - name: Join NetBird agent network
        if: steps.open.outputs.proceed == 'true'
        run: |
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          sudo netbird service install || true
          sudo netbird service start || true
          sudo netbird up --setup-key "$NB_SETUP_KEY" \
            --management-url "${NB_MANAGEMENT_URL:-https://api.netbird.io}"
          # Wait until the client reports Connected before calling the validators.
          for i in $(seq 1 30); do
            if netbird status 2>/dev/null | grep -qiE 'Management:.*Connected|Status: *Connected'; then
              echo "netbird connected"; netbird status --detail || true; exit 0
            fi
            sleep 2
          done
          echo "::error::netbird did not reach Connected state"; netbird status --detail || true; exit 1

      # The whole pipeline: five validators in order, halting on the first
      # StructuredError. Kept in one deterministic driver so the halt-and-report
      # flow is auditable; each iteration is a distinct LLM validation reached
      # over the agent network.
      - name: Run Edict validation pipeline
        id: pipeline
        if: steps.open.outputs.proceed == 'true'
        env:
          NUM: ${{ steps.meta.outputs.number }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -uo pipefail
          # stage key -> human name, in pipeline order.
          keys=(schema names types effects contract)
          declare -A names=(
            [schema]="Schema Validator"
            [names]="Name Resolver"
            [types]="Type Checker"
            [effects]="Effect Checker"
            [contract]="Contract Verifier"
          )

          status() { # <context-suffix> <state> <description>
            gh api -X POST "repos/$REPO/statuses/$SHA" \
              -f state="$2" -f context="agent/edict-$1" \
              -f description="$(printf '%.140s' "$3")" -f target_url="$RUN_URL" >/dev/null
          }

          # The PR as data. gh reads it without a checkout; nothing is executed.
          diff="$(gh pr diff "$NUM" --repo "$REPO")"
          files="$(gh pr view "$NUM" --repo "$REPO" --json files --jq '[.files[].path]')"
          meta="$(gh pr view "$NUM" --repo "$REPO" --json title,body)"
          jq -n --arg repo "$REPO" --argjson num "$NUM" --arg sha "$SHA" \
                --arg diff "$diff" --argjson files "$files" --argjson meta "$meta" \
                '{repo:$repo, pr_number:$num, head_sha:$sha,
                  title:$meta.title, body:$meta.body, changed_files:$files, diff:$diff}' > base.json

          # Pre-mark every stage pending so branch protection sees all contexts.
          for k in "${keys[@]}"; do status "$k" pending "Queued: ${names[$k]}"; done

          halt=""
          for k in "${keys[@]}"; do
            name="${names[$k]}"
            if [ -n "$halt" ]; then
              status "$k" failure "Skipped: upstream stage $halt failed"
              continue
            fi
            jq --arg stage "$k" '. + {stage:$stage}' base.json > payload.json
            code="$(curl -sS -o resp.json -w '%{http_code}' --max-time 180 \
              -H 'Content-Type: application/json' \
              ${AGENT_NETWORK_TOKEN:+-H "Authorization: Bearer $AGENT_NETWORK_TOKEN"} \
              --data @payload.json \
              "https://${k}.${AGENT_NETWORK_DOMAIN}/v1/validate")" || code="000"

            if [ "$code" != "200" ] || ! jq -e . resp.json >/dev/null 2>&1; then
              status "$k" failure "$name unreachable or bad response (HTTP $code)"
              echo "::error::$name validator returned HTTP $code"
              halt="$k"
              echo "halt=$k" >> "$GITHUB_OUTPUT"
              continue
            fi

            if [ "$(jq -r '.ok' resp.json)" = "true" ]; then
              status "$k" success "$name: no findings"
              continue
            fi

            # Failed: record the StructuredError, request changes, and halt.
            status "$k" failure "$name reported a StructuredError"
            halt="$k"
            echo "halt=$k" >> "$GITHUB_OUTPUT"

            errors_md="$(jq -r '
              .errors[]
              | "- **\(.kind // "error")** — \(.message)"
                + (if .location then " (`\(.location)`)" else "" end)
                + (if .candidates then "\n  - candidates: " + (.candidates | join(", ")) else "" end)
                + (if .expected_type then "\n  - expected: `\(.expected_type)`"
                     + (if .actual_type then ", actual: `\(.actual_type)`" else "" end) else "" end)
                + (if .propagation_chain then "\n  - propagation: " + (.propagation_chain | join(" → ")) else "" end)
                + (if .counterexample then "\n  - counterexample: `\(.counterexample | tojson)`" else "" end)
            ' resp.json)"
            raw="$(jq '.' resp.json)"

            {
              printf '## Edict — %s\n\n' "$name"
              printf '### Verdict\nCHANGES REQUESTED\n\n'
              printf '### Findings\n%s\n\n' "$errors_md"
              printf '<details><summary>StructuredError</summary>\n\n```json\n%s\n```\n</details>\n' "$raw"
            } > review.md

            gh pr review "$NUM" --repo "$REPO" --request-changes --body-file review.md
          done

          # The overall gate branch protection can require.
          if [ -n "$halt" ]; then
            status review failure "Edict halted at ${names[$halt]}"
            echo "approved=false" >> "$GITHUB_OUTPUT"
          else
            status review success "All five Edict stages passed"
            echo "approved=true" >> "$GITHUB_OUTPUT"
            gh pr review "$NUM" --repo "$REPO" --approve \
              --body "## Edict — all stages passed"$'\n\n'"Schema, Name, Type, Effect and Contract validation each reported no findings."
          fi

      # Leave the network, whatever happened.
      - name: Leave NetBird agent network
        if: always()
        run: sudo netbird down || true

      # Queue the merge. --auto hands off to branch protection: GitHub merges only
      # once every required check — the Go tests, the acceptance suite, and the
      # agent/edict-* statuses — is green and required reviews are approved, and it
      # re-checks against the head at that time, so a commit pushed after this run
      # will not merge unreviewed. Requires "Allow auto-merge" in repo settings.
      - name: Enable auto-merge
        if: steps.open.outputs.proceed == 'true' && steps.pipeline.outputs.approved == 'true'
        env:
          NUM: ${{ steps.meta.outputs.number }}
        run: gh pr merge "$NUM" --repo "$REPO" --squash --auto
